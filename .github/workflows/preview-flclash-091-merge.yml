name: WONDERX 0.9.1 unified validation

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full materialized private source SHA
        required: true
        default: '48d99d0cefaa972dafa072c3470e9bad881d0be2'
        type: string

      regression_rounds:
        description: Full regression rounds on the same immutable source
        required: true
        default: '1'
        type: choice
        options: ['1', '5']
      package_release:
        description: Build and publish both platforms only after five passing rounds
        required: false
        default: false
        type: boolean
      release_tag:
        description: Unique release tag, required only when packaging
        required: false
        default: ''
        type: string
      normalize_only:
        description: Format reviewed changes on the private candidate branch only
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: wonderx-091-validation-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_SHA: ${{ inputs.source_sha || '48d99d0cefaa972dafa072c3470e9bad881d0be2' }}

  REGRESSION_ROUNDS: ${{ inputs.regression_rounds || '1' }}

jobs:
  format:
    if: inputs.normalize_only == true
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          repository: worldneedme/xxdmanfl0609
          ref: ${{ env.SOURCE_SHA }}
          ssh-key: ${{ secrets.SOURCE_WRITE_KEY }}
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Format reviewed test and commit without rewriting history
        shell: bash
        run: |
          set -euo pipefail
          target=codex/flclash-0.9.1-complete-20261021
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git ls-remote origin "refs/heads/$target" | cut -f1)" = "$SOURCE_SHA"
          flutter pub get > "$RUNNER_TEMP/format-pub.log" 2>&1
          yq -i '.hooks.user_defines.setup.build_assets = false | .hooks.user_defines.rust_api.build_assets = false' pubspec.yaml
          dart run intl_utils:generate > "$RUNNER_TEMP/l10n.log" 2>&1 || { tail -n 25 "$RUNNER_TEMP/l10n.log"; exit 1; }
          dart run build_runner build --delete-conflicting-outputs > "$RUNNER_TEMP/generate.log" 2>&1 || { tail -n 25 "$RUNNER_TEMP/generate.log"; exit 1; }
          sudo apt-get update -qq > "$RUNNER_TEMP/icons-apt.log" 2>&1
          sudo apt-get install -y librsvg2-bin >> "$RUNNER_TEMP/icons-apt.log" 2>&1
          dart run tool/generate_status_icons.dart > "$RUNNER_TEMP/icons.log" 2>&1 || { tail -n 20 "$RUNNER_TEMP/icons.log"; exit 1; }
          git restore -- pubspec.yaml
          dart format lib test tool plugins setup.dart > "$RUNNER_TEMP/format.log" 2>&1
          git diff --check
          git add --update -- lib test tool plugins setup.dart assets/images/tray windows/runner/resources/app_icon.ico
          if ! git diff --cached --quiet; then
            git config user.name github-actions
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git commit -m "chore: regenerate and format reviewed v1 integration changes" > "$RUNNER_TEMP/commit.log"
            git push origin "HEAD:refs/heads/$target"
          fi
          echo "Formatted source SHA: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
  flutter:
    if: inputs.normalize_only != true
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          repository: worldneedme/xxdmanfl0609
          ref: ${{ env.SOURCE_SHA }}
          ssh-key: ${{ secrets.SOURCE_READ_KEY }}
          persist-credentials: false
      - name: Verify immutable source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -s lib/views/dashboard/widgets/current_node_name.dart
          [[ "$REGRESSION_ROUNDS" = 1 || "$REGRESSION_ROUNDS" = 5 ]]
          if [[ "${{ inputs.package_release }}" = true ]]; then
            test "$REGRESSION_ROUNDS" = 5
          fi
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Resolve dependencies
        shell: bash
        run: |
          flutter pub get > "$RUNNER_TEMP/pub.log" 2>&1 || { echo 'Dependency resolution failed'; exit 1; }
      - name: Analyze and verify formatting
        shell: bash
        run: |
          set -euo pipefail
          dart format --output=none --set-exit-if-changed lib test tool plugins setup.dart > "$RUNNER_TEMP/format.log" 2>&1 || { tail -n 20 "$RUNNER_TEMP/format.log"; exit 1; }
          if ! flutter analyze --no-fatal-infos > "$RUNNER_TEMP/analyze.log" 2>&1; then
            grep -E ' (error|warning) [•-]|^error |^warning ' "$RUNNER_TEMP/analyze.log" | head -n 50 || true
            exit 1
          fi
      - name: Verify V1 tray generation is reproducible
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq > "$RUNNER_TEMP/icons-apt.log" 2>&1
          sudo apt-get install -y librsvg2-bin >> "$RUNNER_TEMP/icons-apt.log" 2>&1
          yq -i '.hooks.user_defines.setup.build_assets = false | .hooks.user_defines.rust_api.build_assets = false' pubspec.yaml
          dart run tool/generate_status_icons.dart > "$RUNNER_TEMP/icons.log" 2>&1
          git restore -- pubspec.yaml
          git diff --exit-code -- assets/images/tray windows/runner/resources/app_icon.ico
      - name: Focused consumer UI regressions
        shell: bash
        run: |
          set -euo pipefail
          yq -i '.hooks.user_defines.setup.build_assets = false' pubspec.yaml
          if ! flutter test test/views/disclaimer_test.dart test/manager/window_header_test.dart test/views/dashboard/connections_table_test.dart --reporter expanded > "$RUNNER_TEMP/focused-test.log" 2>&1; then
            grep -m 4 -A 24 'EXCEPTION CAUGHT' "$RUNNER_TEMP/focused-test.log" || true
            tail -n 160 "$RUNNER_TEMP/focused-test.log"
            exit 1
          fi
          tail -n 3 "$RUNNER_TEMP/focused-test.log"
      - name: Full Flutter regression including native Rust tests
        shell: bash
        run: |
          set -euo pipefail
          yq -i '.hooks.user_defines.setup.build_assets = false' pubspec.yaml
          for round in $(seq 1 "$REGRESSION_ROUNDS"); do
          echo "Full regression round $round/$REGRESSION_ROUNDS"
          if ! dart run tool/test.dart > "$RUNNER_TEMP/flutter-test.log" 2>&1; then
            python3 - <<'PY'
          import json
          from pathlib import Path
          report = Path('.dart_tool/test_bundles/report.json')
          tests, errors, messages, failed = {}, {}, {}, set()
          if report.exists():
              for line in report.read_text().splitlines():
                  if not line.startswith('{'):
                      continue
                  event = json.loads(line)
                  kind = event.get('type')
                  if kind == 'testStart':
                      tests[event['test']['id']] = event['test']['name']
                  elif kind == 'print':
                      messages.setdefault(event.get('testID'), []).append(event.get('message', ''))
                  elif kind == 'error':
                      errors.setdefault(event['testID'], []).append(event.get('error', ''))
                  elif kind == 'testDone' and event.get('result') != 'success' and not event.get('skipped'):
                      failed.add(event['testID'])
          for test_id in sorted(failed):
              print('FAILED_TEST:', tests.get(test_id, str(test_id)))
              for message in messages.get(test_id, [])[-3:]:
                  print('\n'.join(message.splitlines()[:36])[:4000])
              for error in errors.get(test_id, []):
                  print('\n'.join(error.splitlines()[:24])[:2400])
          PY
            grep -E '(\[E\]|file\(s\) failed|^  test/|tests passed|Some tests failed)' "$RUNNER_TEMP/flutter-test.log" | tail -n 35 || true
            exit 1
          fi
          tail -n 3 "$RUNNER_TEMP/flutter-test.log"
          echo "Full Flutter round $round/$REGRESSION_ROUNDS PASS; source $SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Verify bundled plugins and setup hooks
        shell: bash
        run: |
          set -euo pipefail
          if ! bash tool/check_plugins.sh > "$RUNNER_TEMP/plugins.log" 2>&1; then
            grep -E '(error |warning |Error:|\[E\]|Failed|failed)' "$RUNNER_TEMP/plugins.log" | tail -n 30 || true
            exit 1
          fi
          cd plugins/setup/setup_hooks
          dart pub get > "$RUNNER_TEMP/setup-pub.log" 2>&1
          dart analyze > "$RUNNER_TEMP/setup-analyze.log" 2>&1
          dart test > "$RUNNER_TEMP/setup-tests.log" 2>&1
      - name: Record evidence
        run: echo "Flutter full validation PASS; source $SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"

  native:
    if: inputs.normalize_only != true
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          repository: worldneedme/xxdmanfl0609
          ref: ${{ env.SOURCE_SHA }}
          ssh-key: ${{ secrets.SOURCE_READ_KEY }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: |
            core/go.sum
            core/Clash.Meta/go.sum
      - name: Go wrapper and Android bridge
        working-directory: core
        env:
          CGO_ENABLED: 0
        shell: bash
        run: |
          set -euo pipefail
          for command in 'go test -v . -count="$REGRESSION_ROUNDS"' 'go vet . ./cmd/...' 'env GOOS=android GOARCH=arm64 go vet -tags=with_gvisor . ./mobile ./tun ./platform'; do
            if ! bash -c "$command" > "$RUNNER_TEMP/go-wrapper.log" 2>&1; then
              echo "Failed command: $command"
              tail -n 65 "$RUNNER_TEMP/go-wrapper.log"
              exit 1
            fi
          done
      - name: Custom protocol parser and adapter regressions
        working-directory: core/Clash.Meta
        shell: bash
        run: |
          set -euo pipefail
          if ! go test ./adapter ./config ./adapter/outbound ./transport/sudoku/... \
            -run 'Test(ParseHelper|Naive|Mieru|Juicity|.*[Hh]ttp[Mm]ask|Sudoku)' \
            -count="$REGRESSION_ROUNDS" -timeout=600s > "$RUNNER_TEMP/protocol-tests.log" 2>&1; then
            tail -n 30 "$RUNNER_TEMP/protocol-tests.log"
            exit 1
          fi
          tail -n 12 "$RUNNER_TEMP/protocol-tests.log"
      - name: Rust components
        shell: bash
        run: |
          set -euo pipefail
          for manifest in services/helper/Cargo.toml plugins/rust_api/rust/Cargo.toml; do
            cargo fmt --manifest-path "$manifest" -- --check > "$RUNNER_TEMP/rust-fmt.log" 2>&1 || { echo "Rust format failed: $manifest"; exit 1; }
            cargo test --manifest-path "$manifest" > "$RUNNER_TEMP/rust-tests.log" 2>&1 || { tail -n 25 "$RUNNER_TEMP/rust-tests.log"; exit 1; }
          done
      - name: Record evidence
        run: echo "Go wrapper, custom protocols and Rust PASS; source $SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"

  packages:
    name: Checked ${{ matrix.platform }} delivery package
    if: inputs.package_release == true && inputs.normalize_only != true && inputs.regression_rounds == '5'
    needs: [flutter, native]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
            arch: arm64-v8a
          - platform: windows
            os: windows-2022
            arch: amd64
    env:
      NAIVE_VERSION: 'v154.0.8037.49-3'
      NAIVE_APK_SHA256: 'c65ecdd032a05d85884eed03e231b23c6feff6b59b1e7de7aa1591ba7d692f0a'
    steps:
      - name: Checkout fixed private source
        uses: actions/checkout@v4
        with:
          repository: worldneedme/xxdmanfl0609
          ref: ${{ env.SOURCE_SHA }}
          ssh-key: ${{ secrets.SOURCE_READ_KEY }}
          persist-credentials: false
      - name: Checkout public validation scripts only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: ci-tools
          persist-credentials: false
      - name: Check immutable source and hooks
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git config --global core.longpaths true
          python - <<'PY'
          import re
          from pathlib import Path
          text = Path('pubspec.yaml').read_text()
          if len(re.findall(r'build_assets:\s*true', text)) != 2:
              raise SystemExit('Both native build hooks must remain enabled for packaging')
          PY
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: |
            core/go.sum
            core/Clash.Meta/go.sum
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true
      - uses: actions/setup-java@v4
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        if: matrix.platform == 'android'
      - uses: nttld/setup-ndk@v1
        if: matrix.platform == 'android'
        id: setup-ndk
        with:
          ndk-version: r28c
          add-to-path: true
          link-to-sdk: true

      - name: Fetch verified pinned Naive Android helper
        if: matrix.platform == 'android'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk="naiveproxy-plugin-$NAIVE_VERSION-arm64-v8a.apk"
          digest=$(gh api "repos/klzgrad/naiveproxy/releases/tags/$NAIVE_VERSION" --jq ".assets[] | select(.name == \"$apk\") | .digest")
          test "$digest" = "sha256:$NAIVE_APK_SHA256"
          curl -fLsS --retry 4 -o "$RUNNER_TEMP/$apk" "https://github.com/klzgrad/naiveproxy/releases/download/$NAIVE_VERSION/$apk"
          echo "$NAIVE_APK_SHA256  $RUNNER_TEMP/$apk" | sha256sum -c -
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          unzip -p "$RUNNER_TEMP/$apk" lib/arm64-v8a/libnaive.so > android/app/src/main/jniLibs/arm64-v8a/libnaive.so
          test -s android/app/src/main/jniLibs/arm64-v8a/libnaive.so

      - name: Compile and package immutable source
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          flutter pub get > "$RUNNER_TEMP/package-pub.log" 2>&1
          if [ "${{ matrix.platform }}" = android ]; then
            command=(dart setup.dart android --arch arm64 -v)
          else
            command=(dart setup.dart windows -v)
          fi
          if ! "${command[@]}" > "$RUNNER_TEMP/package-build.log" 2>&1; then
            grep -A 5 -E '(error:|Error:|FAILURE:|What went wrong:|failed|Exception:)' "$RUNNER_TEMP/package-build.log" | tail -n 65 || true
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Windows service helper regression
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          cargo test --manifest-path services/helper/Cargo.toml --features windows-service
          if ($LASTEXITCODE -ne 0) { throw 'Windows helper regression failed' }
      - name: Android JVM lifecycle regressions
        if: matrix.platform == 'android'
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          if ! (cd android && bash ./gradlew :common:testDebugUnitTest :service:testDebugUnitTest :app:testDebugUnitTest -Ptarget-platform=android-arm64 --no-daemon) > "$RUNNER_TEMP/android-tests.log" 2>&1; then
            tail -n 45 "$RUNNER_TEMP/android-tests.log"; exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for module in ('common', 'service', 'app'):
              reports = list((Path('build') / module / 'test-results/testDebugUnitTest').glob('TEST-*.xml'))
              if not reports:
                  raise SystemExit('Missing JVM test reports for ' + module)
              suites = [ET.parse(p).getroot() for p in reports]
              total = sum(int(s.get('tests', 0)) for s in suites)
              skipped = sum(int(s.get('skipped', 0)) for s in suites)
              failures = sum(int(s.get(k, 0)) for s in suites for k in ('failures', 'errors'))
              if failures or total <= skipped:
                  raise SystemExit('Android JVM test failure: ' + module)
              print(module, total - skipped, 'tests passed')
          PY
      - name: Inspect platform package structure and identity
        shell: bash
        run: python ci-tools/.github/scripts/wonderx_091_check_packages.py ${{ matrix.platform }}
      - name: Install and start the actual Windows setup package
        if: matrix.platform == 'windows'
        shell: pwsh
        run: '& ./ci-tools/.github/scripts/wonderx_091_windows_smoke.ps1'
      - name: Clean only this Windows test installation
        if: always() && matrix.platform == 'windows'
        shell: pwsh
        run: '& ./ci-tools/.github/scripts/wonderx_091_windows_cleanup.ps1'
      - name: Stage checked packages and provenance only
        shell: bash
        env:
          BUILD_PLATFORM: ${{ matrix.platform }}
          BUILD_ARCH: ${{ matrix.arch }}
          WORKFLOW_SHA: ${{ github.sha }}
          BUILD_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, shutil, subprocess
          from pathlib import Path
          platform = os.environ['BUILD_PLATFORM']
          dist, stage = Path('dist'), Path('release-output')
          stage.mkdir()
          packages = [p for p in dist.rglob('*') if p.is_file() and
              (p.suffix == '.apk' if platform == 'android' else
               p.suffix == '.zip' or p.name.endswith('-setup.exe'))]
          expected = 1 if platform == 'android' else 2
          if len(packages) != expected:
              raise SystemExit(f'Expected {expected} delivery files, found {len(packages)}')
          entries = []
          for package in packages:
              target = stage / package.name
              shutil.copy2(package, target)
              entries.append({'filename':target.name,'size_bytes':target.stat().st_size,
                              'sha256':hashlib.sha256(target.read_bytes()).hexdigest()})
          checks = json.loads((dist / 'PACKAGE-CHECKS.json').read_text())
          if platform == 'windows':
              checks['actual_install_start_and_core_rpc'] = 'PASSED'
              checks['installer_wonderx_v1_and_desktop_shortcut_v1'] = 'PASSED'
              checks['scoped_legacy_desktop_shortcut_upgrade'] = 'PASSED'
              checks['fresh_start_without_disclaimer_acceptance'] = 'PASSED'
              checks['user_device_test'] = 'PENDING_DEVICE_TEST'
          elif (dist / 'APK-SIGNATURES.txt').exists():
              shutil.copy2(dist / 'APK-SIGNATURES.txt', stage / 'APK-SIGNATURES.txt')
          manifest = {
              'client_source_sha':os.environ['SOURCE_SHA'],
              'official_ui_base_sha':'8d4f9744948751f1273fe871e1d05276fac09b0e',
              'build_workflow_sha':os.environ['WORKFLOW_SHA'],
              'build_run_url':os.environ['BUILD_RUN_URL'],
              'platform':platform,'architecture':os.environ['BUILD_ARCH'],
              'regression_rounds':5,
              'toolchains':{'flutter':'3.47.7','go':'1.27.1','ndk':'r28c' if platform == 'android' else None},
              'naive_android_version':os.environ['NAIVE_VERSION'] if platform == 'android' else None,
              'naive_upstream_apk_sha256':os.environ['NAIVE_APK_SHA256'] if platform == 'android' else None,
              'checks_completed':checks,'packages':entries,
              'real_device_connection_tests':'PENDING_DEVICE_TEST',
          }
          (stage / f'MANIFEST-{platform}.json').write_text(json.dumps(manifest,indent=2)+'\n')
          (stage / f'SHA256SUMS-{platform}.txt').write_text(
              ''.join(f"{e['sha256']}  {e['filename']}\n" for e in entries))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wonderx-091-checked-${{ matrix.platform }}-${{ github.run_id }}
          path: release-output/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish both checked platforms together
    needs: [flutter, native, packages]
    if: inputs.package_release == true && inputs.normalize_only != true && inputs.regression_rounds == '5'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wonderx-091-checked-*-${{ github.run_id }}
          path: release-files
          merge-multiple: true
      - name: Verify source consistency and checksums
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^wonderx-v1-0\.9\.1-[a-zA-Z0-9._-]+$ ]]
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path('release-files')
          for platform in ('windows','android'):
              manifest=json.loads((root/f'MANIFEST-{platform}.json').read_text())
              assert manifest['client_source_sha']==os.environ['SOURCE_SHA']
              assert manifest['regression_rounds']==5
              for entry in manifest['packages']:
                  p=root/entry['filename']
                  assert p.stat().st_size==entry['size_bytes']
                  assert hashlib.sha256(p.read_bytes()).hexdigest()==entry['sha256']
          assert len(list(root.glob('*-setup.exe')))==1
          assert len(list(root.glob('*.zip')))==1
          assert len(list(root.glob('*.apk')))==1
          PY
      - name: Create real release after all checks passed
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Refusing to overwrite an existing release'; exit 1
          fi
          {
            echo '# WONDERX V1 — consumer dashboard and consistent V1 branding'
            echo
            echo "Source: $SOURCE_SHA"
            echo "Workflow: $GITHUB_SHA"
            echo "Validation and build: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo 'Official 0.9.1 UI/platform base; WONDERX V1 identity and Mieru/Juicity-Hopping/NaiveProxy/Sudoku retained.'
            echo 'Windows installer and Installed Apps display WONDERX V1; the default desktop shortcut is V1. App identity and existing data location retained.'
            echo 'V1 tray logo, simplified dashboard, aligned node name/runtime, gold expanded-sidebar motto, V1 window header.'
            echo 'The former organization slot now reminds users to keep subscriptions updated; all seven locales are included.'
            echo 'First launch enters the app directly: mandatory disclaimer and typed-restatement screens removed. Read-only legal information remains in Tools; OS VPN permissions remain.'
            echo 'Five full Flutter regression rounds, native protocol checks, plugin checks, Windows installer/start/Core RPC, and Android native package/JVM checks passed.'
            echo 'Windows includes setup.exe and ZIP. Android is arm64-v8a, TEST signing with .dev app id; not promised to overwrite your existing signed app.'
            echo 'Windows/Android user-device connections and iPhone tests remain PENDING_DEVICE_TEST.'
            echo 'This release makes no server, subscription panel, DNS or production changes.'
            echo 'See attached manifests and SHA256 checksums for exact provenance.'
          } > "$RUNNER_TEMP/release-notes.md"
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "WONDERX V1 0.9.1 — $RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md" release-files/*
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json url,assets --jq '{url,assets:[.assets[]|{name,size,url}]}'
