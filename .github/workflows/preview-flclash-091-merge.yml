name: WONDERX 0.9.1 unified validation

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full materialized private source SHA
        required: true
        default: '48d99d0cefaa972dafa072c3470e9bad881d0be2'
        type: string

      normalize_only:
        description: Format reviewed changes on the private candidate branch only
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: wonderx-091-validation-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_SHA: ${{ inputs.source_sha || '48d99d0cefaa972dafa072c3470e9bad881d0be2' }}

jobs:
  format:
    if: inputs.normalize_only == true
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          repository: worldneedme/xxdmanfl0609
          ref: ${{ env.SOURCE_SHA }}
          ssh-key: ${{ secrets.SOURCE_WRITE_KEY }}
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Format reviewed test and commit without rewriting history
        shell: bash
        run: |
          set -euo pipefail
          target=codex/flclash-0.9.1-complete-20261021
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git ls-remote origin "refs/heads/$target" | cut -f1)" = "$SOURCE_SHA"
          flutter pub get > "$RUNNER_TEMP/format-pub.log" 2>&1
          dart format lib test tool plugins setup.dart > "$RUNNER_TEMP/format.log" 2>&1
          git diff --check
          git add --update -- lib test tool plugins setup.dart
          if ! git diff --cached --quiet; then
            git config user.name github-actions
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git commit -m "style: format node-name dashboard regressions" > "$RUNNER_TEMP/commit.log"
            git push origin "HEAD:refs/heads/$target"
          fi
          echo "Formatted source SHA: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
  flutter:
    if: inputs.normalize_only != true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          repository: worldneedme/xxdmanfl0609
          ref: ${{ env.SOURCE_SHA }}
          ssh-key: ${{ secrets.SOURCE_READ_KEY }}
          persist-credentials: false
      - name: Verify immutable source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -s lib/views/dashboard/widgets/current_node_name.dart
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Resolve dependencies
        shell: bash
        run: |
          flutter pub get > "$RUNNER_TEMP/pub.log" 2>&1 || { echo 'Dependency resolution failed'; exit 1; }
      - name: Analyze and verify formatting
        shell: bash
        run: |
          set -euo pipefail
          dart format --output=none --set-exit-if-changed lib test tool plugins setup.dart > "$RUNNER_TEMP/format.log" 2>&1 || { tail -n 20 "$RUNNER_TEMP/format.log"; exit 1; }
          if ! flutter analyze --no-fatal-infos > "$RUNNER_TEMP/analyze.log" 2>&1; then
            grep -E ' (error|warning) [•-]|^error |^warning ' "$RUNNER_TEMP/analyze.log" | head -n 50 || true
            exit 1
          fi
      - name: Full Flutter regression including native Rust tests
        shell: bash
        run: |
          set -euo pipefail
          yq -i '.hooks.user_defines.setup.build_assets = false' pubspec.yaml
          if ! dart run tool/test.dart > "$RUNNER_TEMP/flutter-test.log" 2>&1; then
            python3 - <<'PY'
          import json
          from pathlib import Path
          report = Path('.dart_tool/test_bundles/report.json')
          tests, errors, failed = {}, {}, set()
          if report.exists():
              for line in report.read_text().splitlines():
                  if not line.startswith('{'):
                      continue
                  event = json.loads(line)
                  kind = event.get('type')
                  if kind == 'testStart':
                      tests[event['test']['id']] = event['test']['name']
                  elif kind == 'error':
                      errors.setdefault(event['testID'], []).append(event.get('error', ''))
                  elif kind == 'testDone' and event.get('result') != 'success' and not event.get('skipped'):
                      failed.add(event['testID'])
          for test_id in sorted(failed):
              print('FAILED_TEST:', tests.get(test_id, str(test_id)))
              for error in errors.get(test_id, []):
                  print('\n'.join(error.splitlines()[:24])[:2400])
          PY
            grep -E '(\[E\]|file\(s\) failed|^  test/|tests passed|Some tests failed)' "$RUNNER_TEMP/flutter-test.log" | tail -n 35 || true
            exit 1
          fi
          tail -n 3 "$RUNNER_TEMP/flutter-test.log"
      - name: Verify bundled plugins and setup hooks
        shell: bash
        run: |
          set -euo pipefail
          if ! bash tool/check_plugins.sh > "$RUNNER_TEMP/plugins.log" 2>&1; then
            grep -E '(error |warning |Error:|\[E\]|Failed|failed)' "$RUNNER_TEMP/plugins.log" | tail -n 30 || true
            exit 1
          fi
          cd plugins/setup/setup_hooks
          dart pub get > "$RUNNER_TEMP/setup-pub.log" 2>&1
          dart analyze > "$RUNNER_TEMP/setup-analyze.log" 2>&1
          dart test > "$RUNNER_TEMP/setup-tests.log" 2>&1
      - name: Record evidence
        run: echo "Flutter full validation PASS; source $SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"

  native:
    if: inputs.normalize_only != true
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          repository: worldneedme/xxdmanfl0609
          ref: ${{ env.SOURCE_SHA }}
          ssh-key: ${{ secrets.SOURCE_READ_KEY }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: |
            core/go.sum
            core/Clash.Meta/go.sum
      - name: Go wrapper and Android bridge
        working-directory: core
        env:
          CGO_ENABLED: 0
        shell: bash
        run: |
          set -euo pipefail
          for command in 'go test .' 'go vet . ./cmd/...' 'env GOOS=android GOARCH=arm64 go vet -tags=with_gvisor . ./mobile ./tun ./platform'; do
            if ! bash -c "$command" > "$RUNNER_TEMP/go-wrapper.log" 2>&1; then
              grep -A 10 -E '^--- FAIL|^# |^.*\.go:[0-9]+:' "$RUNNER_TEMP/go-wrapper.log" | head -n 80 || true
              exit 1
            fi
          done
      - name: Custom protocol parser and adapter regressions
        working-directory: core/Clash.Meta
        shell: bash
        run: |
          set -euo pipefail
          if ! go test ./adapter ./config ./adapter/outbound ./transport/sudoku/... \
            -run 'Test(ParseHelper|Naive|Mieru|Juicity|.*[Hh]ttp[Mm]ask|Sudoku)' \
            -count=1 -timeout=240s > "$RUNNER_TEMP/protocol-tests.log" 2>&1; then
            tail -n 30 "$RUNNER_TEMP/protocol-tests.log"
            exit 1
          fi
          tail -n 12 "$RUNNER_TEMP/protocol-tests.log"
      - name: Rust components
        shell: bash
        run: |
          set -euo pipefail
          for manifest in services/helper/Cargo.toml plugins/rust_api/rust/Cargo.toml; do
            cargo fmt --manifest-path "$manifest" -- --check > "$RUNNER_TEMP/rust-fmt.log" 2>&1 || { echo "Rust format failed: $manifest"; exit 1; }
            cargo test --manifest-path "$manifest" > "$RUNNER_TEMP/rust-tests.log" 2>&1 || { tail -n 25 "$RUNNER_TEMP/rust-tests.log"; exit 1; }
          done
      - name: Record evidence
        run: echo "Go wrapper, custom protocols and Rust PASS; source $SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
