name: WONDERX 0.9.1 official-base integration

on:
  push:
    branches:
      - work/wonderx-091-validation
    paths:
      - .github/workflows/wonderx-091-official-base.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-core:
    name: Official 0.9.1 UI plus protected private core
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      SOURCE_SHA: 'a6588c1806b7a84581f4f1c1d8f02139b827c704'
      UPSTREAM_TAG: v0.9.1
    steps:
      - name: Checkout private source commit
        uses: actions/checkout@v4
        with:
          repository: worldneedme/xxdmanfl0609
          ref: ${{ env.SOURCE_SHA }}
          ssh-key: ${{ secrets.SOURCE_READ_KEY }}
          fetch-depth: 0
          persist-credentials: false

      - name: Compose exact official 0.9.1 UI and V1 features
        shell: bash
        env:
          WONDERX_SOURCE_SHA: ${{ env.SOURCE_SHA }}
        run: |
          bash tool/wonderx_091_compose.sh
          {
            echo "## WONDERX V1 official 0.9.1 fusion"
            echo "- Source SHA: $SOURCE_SHA"
            echo "- Brand, Android/Windows/macOS icon resources and private core: preserved"
            echo "- Official new navigation, dashboard, theme and UI: applied"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true

      - name: Install Flutter packages
        run: flutter pub get

      - name: Analyze full official UI
        run: flutter analyze --no-fatal-infos

      - name: Run widget and unit tests
        shell: bash
        run: |
          if grep -q '^hooks:' pubspec.yaml; then
            yq -i '.hooks.user_defines.setup.build_assets = false | .hooks.user_defines.rust_api.build_assets = false' pubspec.yaml
          fi
          flutter test test/wonderx_brand_contract_test.dart test/widgets/navigation_dock_test.dart test/views/dashboard/layout_test.dart test/views/theme_test.dart test/database/migration_v1_to_v2_test.dart test/wonderx_protocol_editor_contract_test.dart --reporter expanded

      - name: Setup Go 1.27
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: |
            core/go.sum
            core/Clash.Meta/go.sum

      - name: Compile custom Mihomo Go adapter
        working-directory: core/Clash.Meta
        run: |
          go test ./adapter ./config ./adapter/outbound -run 'TestParseHelperBackedProtocols|TestParseHelperBackedProtocolConfig|TestJuicityNativeConstruction|TestMieru' -count=1 -timeout=240s

      - name: Confirm integration checks passed
        if: success()
        run: |
          echo "- Flutter dependency/analyzer/widget tests: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "- Custom Go adapter tests: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "- Cross-platform app compilation and live connections: NOT TESTED" >> "$GITHUB_STEP_SUMMARY"

  packages:
    name: 0.9.1 ${{ matrix.platform }} integration package
    needs: ui-core
    runs-on: ${{ matrix.os }}
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
            arch: arm64-v8a
          - platform: windows
            os: windows-2022
            arch: amd64
    env:
      SOURCE_SHA: 'a6588c1806b7a84581f4f1c1d8f02139b827c704'
      NAIVE_VERSION: 'v154.0.8037.49-3'
      NAIVE_APK_SHA256: 'c65ecdd032a05d85884eed03e231b23c6feff6b59b1e7de7aa1591ba7d692f0a'
    steps:
      - name: Checkout protected source
        uses: actions/checkout@v4
        with:
          repository: worldneedme/xxdmanfl0609
          ref: ${{ env.SOURCE_SHA }}
          ssh-key: ${{ secrets.SOURCE_READ_KEY }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare source with official UI and WONDERX protocols
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git config --global core.longpaths true
          bash tool/wonderx_091_compose.sh

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: |
            core/go.sum
            core/Clash.Meta/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true

      - name: Setup NDK
        if: matrix.platform == 'android'
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          add-to-path: true
          link-to-sdk: true

      - name: Fetch pinned Naive Android helper
        if: matrix.platform == 'android'
        shell: bash
        run: |
          set -euo pipefail
          apk="naiveproxy-plugin-$NAIVE_VERSION-arm64-v8a.apk"
          curl -fLsS --retry 4 -o "$RUNNER_TEMP/$apk" \
            "https://github.com/klzgrad/naiveproxy/releases/download/$NAIVE_VERSION/$apk"
          echo "$NAIVE_APK_SHA256  $RUNNER_TEMP/$apk" | sha256sum -c -
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          unzip -p "$RUNNER_TEMP/$apk" lib/arm64-v8a/libnaive.so \
            > android/app/src/main/jniLibs/arm64-v8a/libnaive.so
          test -s android/app/src/main/jniLibs/arm64-v8a/libnaive.so

      - name: Build Android or Windows test package
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          (cd core && go mod tidy)
          flutter pub get
          if [ "${{ matrix.platform }}" = 'android' ]; then
            dart setup.dart android --arch arm64 -v
            test "$(find ./dist -type f -name '*.apk' | wc -l)" -gt 0
          else
            dart setup.dart windows -v
            test "$(find ./dist -type f -name '*.zip' | wc -l)" -gt 0
            test "$(find ./dist -type f -name '*.exe' | wc -l)" -gt 0
            # Building an EXE and ZIP is not enough: preserve the V1 Naive helper.
            python -c 'import glob,zipfile,sys; zs=glob.glob("dist/**/*.zip",recursive=True); ok=bool(zs) and all({"flclashcore.exe","protocol-helpers/naive.exe"}.issubset({n.lower().replace(chr(92),"/") for n in zipfile.ZipFile(p).namelist()}) for p in zs); print("WONDERX ZIP includes core + NaiveProxy helper:",ok); sys.exit(0 if ok else 2)'
          fi
          find ./dist -type f -printf '%f\n' 2>/dev/null || true

      - name: Upload preview packages for user testing
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: wonderx-flclash-091-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/**/*.apk
            dist/**/*.exe
            dist/**/*.zip
          if-no-files-found: error
          retention-days: 7

      - name: Record compiled package
        if: success()
        shell: bash
        run: |
          echo "${{ matrix.platform }} test package built from WONDERX $SOURCE_SHA and official FlClash 0.9.1 UI. No live subscription tests performed." >> "$GITHUB_STEP_SUMMARY"
