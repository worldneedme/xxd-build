name: V1 tutorial import smoke
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing public Windows release to verify
        required: true
        default: custom-v0.8.98-hop1
        type: string
permissions:
  contents: read
jobs:
  import:
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install and verify cold and warm tutorial imports
        shell: pwsh
        env:
          SMOKE_RELEASE_TAG: ${{ inputs.release_tag }}
        run: ./tool/v1-deeplink-smoke.ps1 -ReleaseTag $env:SMOKE_RELEASE_TAG
      - name: Save isolated import diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v1-import-smoke
          path: ${{ runner.temp }}/v1-import-${{ github.run_id }}/*.log
          retention-days: 7
      - name: Save import result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v1-import-result
          path: ${{ runner.temp }}/v1-import-${{ github.run_id }}/report.json
          retention-days: 7
