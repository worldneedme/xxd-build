name: V1 tutorial import smoke
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing public Windows release to verify
        required: true
        default: custom-v0.8.98-hop1
        type: string
permissions:
  contents: read
jobs:
  import:
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install and verify cold and warm tutorial imports
        shell: pwsh
        env:
          SMOKE_RELEASE_TAG: ${{ inputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
        run: ./tool/v1-deeplink-smoke.ps1 -ReleaseTag $env:SMOKE_RELEASE_TAG
      - name: Save isolated import diagnostics
        if: always()
        shell: pwsh
        run: |
          $smokeRoot = Join-Path $env:RUNNER_TEMP ('v1-import-' + $env:GITHUB_RUN_ID)
          Get-ChildItem -LiteralPath $smokeRoot -Filter '*.log' | ForEach-Object { Get-Content -LiteralPath $_.FullName -Tail 25 }
          $report = Join-Path $smokeRoot 'report.json'
          if (Test-Path -LiteralPath $report) { Get-Content -LiteralPath $report | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append }
